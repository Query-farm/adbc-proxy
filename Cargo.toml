[workspace]
resolver = "2"
members = [
    "crates/adbc-proxy-protocol",
    "crates/adbc-proxy-server",
    "crates/adbc-driver-proxy",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Query-farm/adbc-proxy"

[workspace.dependencies]
adbc_core = { git = "https://github.com/apache/arrow-adbc.git", rev = "616acfdfcea9b66956fdb3d11437b6cf24edbc39" }
adbc_driver_manager = { git = "https://github.com/apache/arrow-adbc.git", rev = "616acfdfcea9b66956fdb3d11437b6cf24edbc39" }
adbc_ffi = { git = "https://github.com/apache/arrow-adbc.git", rev = "616acfdfcea9b66956fdb3d11437b6cf24edbc39" }
arrow-array = "59"
arrow-ipc = "59"
arrow-schema = "59"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
vgi-rpc = { version = "0.26.0", features = ["http", "jwt-jsonwebtoken", "otel", "tcp-mtls"] }
vgi-rpc-client = { version = "0.26.0", features = ["http"] }
vgi-rpc-iroh = "0.26.0"
