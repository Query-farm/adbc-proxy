<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">Grainlift</title>
  <desc id="desc">A grain elevator with two silos and an upward data arrow beside the Grainlift wordmark.</desc>

  <style>
    .wordmark { fill: #211a12; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 102px; font-weight: 750; letter-spacing: -4px; }
    .tagline { fill: #7a6a58; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 650; letter-spacing: 5px; }
    .elevator { fill: #d9a441; stroke: #7a5230; stroke-width: 7; stroke-linejoin: round; }
    .silo { fill: #fff6df; stroke: #a9762e; stroke-width: 7; stroke-linejoin: round; }
    .structure { fill: none; stroke: #7a5230; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .silo-rib { fill: none; stroke: #d9a441; stroke-width: 3; opacity: 0.68; }
    .flow { fill: none; stroke: #00a4e4; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .field { fill: none; stroke: #5d8467; stroke-width: 7; stroke-linecap: round; }

    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #f4ece0; }
      .tagline { fill: #c8b9a6; }
      .elevator { fill: #b47a2c; stroke: #edc477; }
      .silo { fill: #332918; stroke: #d6a863; }
      .structure { stroke: #edc477; }
      .silo-rib { stroke: #d6a863; }
      .field { stroke: #80ad8b; }
    }
  </style>

  <g transform="translate(14 15)">
    <!-- Cylindrical grain silos -->
    <path class="silo" d="M15 181 V87 C15 68 29 55 49 55 C69 55 83 68 83 87 V181 Z"/>
    <path class="silo" d="M139 181 V87 C139 68 153 55 173 55 C193 55 207 68 207 87 V181 Z"/>
    <path class="silo-rib" d="M32 67 V177 M49 58 V177 M66 67 V177"/>
    <path class="silo-rib" d="M156 67 V177 M173 58 V177 M190 67 V177"/>

    <!-- Tall head house and elevator leg -->
    <path class="elevator" d="M80 181 V44 H91 V25 H131 V44 H142 V181 Z"/>
    <path class="structure" d="M88 25 L111 10 L134 25 M91 44 H131"/>

    <!-- Conveyor gallery linking the elevator to both silos -->
    <path class="structure" d="M38 59 H91 M131 59 H184"/>
    <path class="structure" d="M38 71 H91 M131 71 H184" opacity="0.72"/>
    <path class="structure" d="M47 59 L59 71 L71 59 L83 71 M139 59 L151 71 L163 59 L175 71" stroke-width="4"/>

    <!-- Data and grain move upward through the elevator -->
    <path class="flow" d="M111 154 V68"/>
    <path class="flow" d="M91 87 L111 67 L131 87"/>

    <path class="structure" d="M7 181 H215"/>
    <path class="field" d="M8 199 C43 179 77 179 111 198 C145 217 178 215 213 194"/>
    <path class="field" d="M13 211 C43 194 72 194 101 210" opacity="0.6"/>
  </g>

  <text class="wordmark" x="248" y="137">Grainlift</text>
  <text class="tagline" x="255" y="184">NETWORKED ADBC</text>
</svg>
